databases:
  - name: sofia-db
    databaseName: sofia_db
    user: sofia
    plan: free
    
services:
  - type: web
    name: sofia-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    # preDeployCommand requires a paid Render plan -- this service is on
    # free, so migrations run at boot instead. scripts/migrate.js is
    # idempotent (tracks applied versions in schema_migrations), so
    # re-running it on every restart, not just real deploys, is safe.
    startCommand: cd backend && npm run migrate && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sofia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5
      - key: CORS_ORIGIN
        value: https://sofia-frontend-2448.onrender.com
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
    
  - type: web
    name: sofia-frontend
    runtime: static
    # NO PLAN FIELD FOR STATIC SITES - they're always free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sofia-backend-o6jq.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
